      responses:
        '200':
          description: A list of available voices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceResponse'
              example:
                voices:
                - name: Amelia
                  name_ar: أميليا
                  gender: Female
                  accent: British
                  languages:
                  - en
                  type: public
                  emotion: false
                - name: Hamad
                  name_ar: حمد
                  gender: Male
                  accent: Gulf
                  languages:
                  - ar
                  type: public
                  emotion: false
                - name: MyVoice
                  languages: []
