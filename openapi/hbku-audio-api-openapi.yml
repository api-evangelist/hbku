  /v1/audio/transcriptions/stream:
    get:
      tags:
      - Audio
      summary: Create Streaming Transcription
      description: 'Transcribes live audio over a WebSocket, returning the text while the speaker talks.

        Send the audio as binary frames (16 kHz, mono, 16-bit PCM) and {"type": "input.end"} when it is over. The server replies with transcript.partial and transcript.final events, then session.ended with the full text and a reason: completed after input.end, max_duration, idle_timeout (no audio for 30 seconds) or upstream_error. A session lasts up to the maximum set for your API key (600 seconds by default), given in session.started. Connect from your server: browsers cannot set the Authorization header on a WebSocket.'
      operationId: create_streaming_transcription
      parameters:
      - name: model
        in: query
        required: true
        description: The model to use for live speech-to-text.
        schema:
          type: string
          enum:
          - Fanar-3.0-Aura-Transcribe
      responses:
        '101':
          description: 'Switching Protocols: the WebSocket is open, and the first event is <code>session.started</code>.'
        '401':
          description: Invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_authentication
                  message: Invalid authentication
                  status: 401
        '403':
          description: Invalid authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_authorization
                  message: Invalid authorization
                  status: 403
        '429':
          description: Rate limit reached or Exceeded quota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: exceeded_quota
                  message: Exceeded quota
                  status: 429
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: internal_server_error
                  message: Internal server error
                  status: 500
        '503':
          description: Service overloaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: overloaded
                  message: Service overloaded
                  status: 503
        '422':
          description: Unprocessable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unprocessable
                  message: Unprocessable
                  status: 422
      x-codeSamples:
      - lang: Python
        label: Python - stream a file
        source: "# Live streaming transcription requires the speech_to_text_stream feature and is not allowed by default.\n# pip install \"websockets>=14\"\nimport asyncio\nimport json\nimport wave\n\nimport websockets\n\nURL = \"wss://api.fanar.qa/v1/audio/transcriptions/stream?model=Fanar-3.0-Aura-Transcribe\"\nHEADERS = {\"Authorization\": \"Bearer YOUR_API_KEY\"}\nFRAME_SECONDS = 0.1  # 100 ms of audio per frame\n\n\nasync def send_audio(ws, path):\n    # 16 kHz, mono, 16-bit PCM. A WAV file's frames are exactly what the stream takes.\n    with wave.open(path, \"rb\") as wav:\n        assert (wav.getframerate(), wav.getnchannels(), wav.getsampwidth()) == (16000, 1, 2)\n        frames_per_chunk = int(16000 * FRAME_SECONDS)\n        while chunk := wav.readframes(frames_per_chunk):\n            await ws.send(chunk)                  # a binary frame is audio\n            await asyncio.sleep(FRAME_SECONDS)    # paced like a live speaker\n    await ws.send(json.dumps({\"type\": \"input.end\"}))  # no more audio\n\n\nasync def main():\n    async with websockets.connect(URL, additional_headers=HEADERS) as ws:\n        sender = None\n        async for raw in ws:\n            event = json.loads(raw)\n            kind = event[\"type\"]\n            if kind == \"session.started\":\n                print(f\"session {event['id']}: up to {event['max_duration_seconds']}s\")\n                sender = asyncio.create_task(send_audio(ws, \"sample.wav\"))\n            elif kind == \"transcript.partial\":\n                # The open segment so far. Not cumulative: replace it in place.\n                print(f\"\\r... {event['text']}\", end=\"\", flush=True)\n            elif kind == \"transcript.final\":\n                # That segment is done. Keep it; finals in segment order are the transcript.\n                print(f\"\\r{event['text']}\")\n            elif kind == \"session.expiring\":\n                print(f\"\\n{event['seconds_remaining']}s left in this session\")\n            elif kind == \"error\":\n                print(f\"\\nerror {event['code']}: {event['message']}\")\n            elif kind == \"session.ended\":\n                print(f\"\\nended ({event['reason']}): {event['text']}\")\n        if sender:\n            sender.cancel()\n\n\nasyncio.run(main())\n"
      - lang: Python - microphone
        label: Python - microphone
        source: "# Live streaming transcription requires the speech_to_text_stream feature and is not allowed by default.\n# pip install \"websockets>=14\" sounddevice\nimport asyncio\nimport json\nimport signal\n\nimport sounddevice as sd\nimport websockets\n\nURL = \"wss://api.fanar.qa/v1/audio/transcriptions/stream?model=Fanar-3.0-Aura-Transcribe\"\nHEADERS = {\"Authorization\": \"Bearer YOUR_API_KEY\"}\n\n\nasync def main():\n    loop = asyncio.get_running_loop()\n    audio = asyncio.Queue()\n    stop = asyncio.Event()\n    loop.add_signal_handler(signal.SIGINT, stop.set)  # Ctrl-C finishes the input, not the program\n\n    def on_audio(indata, frames, time, status):\n        loop.call_soon_threadsafe(audio.put_nowait, bytes(indata))\n\n    async def send(ws):\n        # 1600 samples = 100 ms per frame, already 16 kHz mono 16-bit PCM.\n        with sd.RawInputStream(samplerate=16000, channels=1, dtype=\"int16\",\n                               blocksize=1600, callback=on_audio):\n            while not stop.is_set():\n                try:\n                    chunk = await asyncio.wait_for(audio.get(), timeout=0.5)\n                except asyncio.TimeoutError:\n                    continue\n                await ws.send(chunk)\n        await ws.send(json.dumps({\"type\": \"input.end\"}))\n\n    async with websockets.connect(URL, additional_headers=HEADERS) as ws:\n        started = json.loads(await ws.recv())\n        deadline = loop.time() + started[\"max_duration_seconds\"]\n        print(f\"Speak now (up to {started['max_duration_seconds']}s). Ctrl-C to finish.\")\n        sender = asyncio.create_task(send(ws))\n        async for raw in ws:\n            event = json.loads(raw)\n            left = max(0, int(deadline - loop.time()))\n            if event[\"type\"] == \"transcript.partial\":\n                print(f\"\\r[{left:>3}s] {event['text']}\", end=\"\", flush=True)\n            elif event[\"type\"] == \"transcript.final\":\n                print(f\"\\r[{left:>3}s] {event['text']}\")\n            elif event[\"type\"] == \"session.expiring\":\n                print(f\"\\n{event['seconds_remaining']}s left - wrap up\")\n            elif event[\"type\"] == \"session.ended\":\n                print(f\"\\nended ({event['reason']}): {event['text']}\")\n        stop.set()\n        await asyncio.gather(sender, return_exceptions=True)\n\n\nasyncio.run(main())\n"
      - lang: JavaScript
        label: Node.js - ws
        source: "// Live streaming transcription requires the speech_to_text_stream feature and is not allowed by default.\n// npm install ws   (Node 18+, saved as stream.mjs)\nimport fs from \"node:fs\";\nimport WebSocket from \"ws\";\n\nconst URL = \"wss://api.fanar.qa/v1/audio/transcriptions/stream?model=Fanar-3.0-Aura-Transcribe\";\nconst ws = new WebSocket(URL, { headers: { Authorization: \"Bearer YOUR_API_KEY\" } });\n\n// The upgrade was refused (401, 403, 422, 429, 503) -- nothing was streamed.\nws.on(\"unexpected-response\", (req, res) => {\n  console.error(`refused: HTTP ${res.statusCode}`, res.headers[\"retry-after\"] ?? \"\");\n});\n\nws.on(\"message\", (data) => {\n  const event = JSON.parse(data.toString());\n  switch (event.type) {\n    case \"session.started\":\n      console.log(`session ${event.id}: up to ${event.max_duration_seconds}s`);\n      streamFile(\"sample.wav\");\n      break;\n    case \"transcript.partial\": // the open segment so far; replace it in place\n      process.stdout.write(`\\r... ${event.text}`);\n      break;\n    case \"transcript.final\": // that segment is done; keep it\n      process.stdout.write(`\\r${event.text}\\n`);\n      break;\n    case \"session.expiring\":\n      console.log(`\\n${event.seconds_remaining}s left in this session`);\n      break;\n    case \"error\":\n      console.error(`\\nerror ${event.code}: ${event.message}`);\n      break;\n    case \"session.ended\":\n      console.log(`\\nended (${event.reason}): ${event.text}`);\n      break;\n  }\n});\n\nws.on(\"close\", (code) => console.log(`closed with ${code}`));\n\nasync function streamFile(path) {\n  // A canonical 16 kHz mono 16-bit WAV: skip its 44-byte header, send 100 ms (3200 bytes) at a time.\n  const pcm = fs.readFileSync(path).subarray(44);\n  for (let i = 0; i < pcm.length; i += 3200) {\n    if (ws.readyState !== WebSocket.OPEN) return;\n    ws.send(pcm.subarray(i, i + 3200));\n    await new Promise((resolve) => setTimeout(resolve, 100));\n  }\n  ws.send(JSON.stringify({ type: \"input.end\" }));\n}\n"
