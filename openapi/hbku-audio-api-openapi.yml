          title: Voice
          description: 'The voice to use for the text-to-speech. Details are below:

            <table style="min-width:600px"><thead><tr><th nowrap width="160">Voice</th><th nowrap width="80">Gender</th><th nowrap width="180">Supported Languages</th><th nowrap width="100">Accent</th><th nowrap width="80">Emotion</th></tr></thead><tbody><tr><td nowrap>Abdulrahman</td><td nowrap>Male</td><td><a href="https://chat.fanar.qa/api/sample-voices/ar/Abdulrahman">Arabic</a></td><td nowrap>Standard</td><td nowrap>✓</td></tr><tr><td nowrap>Amelia</td><td nowrap>Female</td><td><a href="https://chat.fanar.qa/api/sample-voices/en/Amelia">English</a></td><td nowrap>British</td><td nowrap>—</td></tr><tr><td nowrap>Emily</td><td nowrap>Female</td><td><a href="https://chat.fanar.qa/api/sample-voices/en/Emily">English</a></td><td nowrap>American</td><td nowrap>—</td></tr><tr><td nowrap>Hamad</td><td nowrap>Male</td><td><a href="https://chat.fanar.qa/api/sample-voices/ar/Hamad">Arabic</a></td><td nowrap>Standard</td><td nowrap>—</td></tr><tr><td nowrap>Harry</td><td nowrap>Male</td><td><a href="https://chat.fanar.qa/api/sample-voices/en/Harry">English</a></td><td nowrap>British</td><td nowrap>—</td></tr><tr><td nowrap>Huda</td><td nowrap>Female</td><td><a href="https://chat.fanar.qa/api/sample-voices/ar/Huda">Arabic</a></td><td nowrap>Standard</td><td nowrap>—</td></tr><tr><td nowrap>Jake</td><td nowrap>Male</td><td><a href="https://chat.fanar.qa/api/sample-voices/en/Jake">English</a></td><td nowrap>American</td><td nowrap>—</td></tr><tr><td nowrap>Jasim</td><td nowrap>Male</td><td><a href="https://chat.fanar.qa/api/sample-voices/ar/Jasim">Arabic</a></td><td nowrap>Standard</td><td nowrap>—</td></tr><tr><td nowrap>Noor</td><td nowrap>Female</td><td><a href="https://chat.fanar.qa/api/sample-voices/ar/Noor">Arabic</a></td><td nowrap>Standard</td><td nowrap>—</td></tr><tr><td nowrap>Radwa</td><td nowrap>Female</td><td><a href="https://chat.fanar.qa/api/sample-voices/ar/Radwa">Arabic</a></td><td nowrap>Standard</td><td nowrap>✓</td></tr></tbody></table>'
          enum:
          - Abdulrahman
          - Amelia
          - Emily
          - Hamad
          - Harry
          - Huda
          - Jake
          - Jasim
          - Noor
          - Radwa
        response_format:
          $ref: '#/components/schemas/TTSResponseFormat'
