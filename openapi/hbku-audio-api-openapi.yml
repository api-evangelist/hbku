        name:
          type: string
          title: Name
          description: The English name of the voice. This is the identifier passed to the TTS endpoint.
          examples:
          - Amelia
        name_ar:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Ar
          description: The Arabic display name of the voice, when available.
          examples:
