        input:
          type: string
          title: Input
          description: The research topic or question to investigate.
        stream:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Stream
          description: Whether to stream the response. Defaults to `true`, or to `false` when `background` is set.
        depth:
          anyOf:
          - $ref: '#/components/schemas/DeepResearchDepth'
          - type: 'null'
          description: 'Research depth: quick, standard, or comprehensive.'
          default: standard
        web_search:
          anyOf:
