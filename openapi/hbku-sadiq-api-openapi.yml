        source: "# The job's events. Omit starting_after to start from the first event; pass the last\n# `id:` you received to resume. `data: [DONE]` is the end of the job; a response that\n# ends without it is resumed the same way.\ncurl -N \"https://api.fanar.qa/v1/sadiq/deep-research/YOUR_JOB_ID?stream=true&starting_after=LAST_EVENT_ID\" \\\n  -H \"Authorization: Bearer YOUR_API_KEY_HERE\"\n"
      - lang: Python
        label: Python - poll until done
        source: "import time\n\nimport requests\n\nBASE_URL = \"https://api.fanar.qa\"\nAPI_KEY = \"YOUR_API_KEY_HERE\"\nJOB_ID = \"YOUR_JOB_ID\"  # the `id` from the create call, also its X-Id header\n\n\ndef wait_for(job_id, every=10):\n    while True:\n        response = requests.get(\n            f\"{BASE_URL}/v1/sadiq/deep-research/{job_id}\",\n            headers={\"Authorization\": f\"Bearer {API_KEY}\"},\n            timeout=30,\n        )\n        if response.status_code == 404:\n            # Unknown, created under a different access, or past its 24-hour retention.\n            raise SystemExit(\"no such job\")\n        response.raise_for_status()\n        job = response.json()\n        if job[\"status\"] not in (\"queued\", \"in_progress\"):\n            return job\n        print(f\"{job['status']} {job['progress_pct']}% (attempt {job['attempt']})\")\n        time.sleep(every)\n\n\njob = wait_for(JOB_ID)\nif job[\"status\"] == \"completed\":\n    print(job[\"result\"][\"title\"])\nelif job[\"status\"] == \"incomplete\":\n    # The output was stopped by a content filter; there is no result.\n    print(\"incomplete:\", job[\"incomplete_details\"][\"reason\"])\nelif job[\"status\"] == \"cancelled\":\n    print(\"cancelled by\", job[\"cancel_source\"])\nelse:  # failed\n    print(\"failed:\", job[\"error\"][\"code\"], job[\"error\"][\"message\"])\n"
      - lang: Python - stream with resume
        label: Python - stream with resume
        source: "# Follow a job's events to the end, from its first event, surviving any number of\n# dropped or closed connections. Each event's `id:` is a resume point.\n\nimport json\nimport time\n\nimport requests\n\nBASE_URL = \"https://api.fanar.qa\"\nAPI_KEY = \"YOUR_API_KEY_HERE\"\nJOB_ID = \"YOUR_JOB_ID\"\n\n\ndef events(job_id, after):\n    \"\"\"(id, payload) for each event after `after`, until the response ends.\"\"\"\n    with requests.get(\n        f\"{BASE_URL}/v1/sadiq/deep-research/{job_id}\",\n        headers={\"Authorization\": f\"Bearer {API_KEY}\"},\n        params={\"stream\": \"true\", \"starting_after\": after},\n        stream=True,\n        timeout=(10, 120),  # a keepalive arrives every 15 seconds of quiet\n    ) as response:\n        response.raise_for_status()\n        event_id = None\n        for line in response.iter_lines(decode_unicode=True):\n            if line.startswith(\"id: \"):\n                event_id = line[4:]\n            elif line.startswith(\"data: \"):\n                yield event_id, line[6:]\n\n\nlast_id, report, done = None, None, False\nwhile not done:\n    try:\n        for event_id, data in events(JOB_ID, last_id):\n            last_id = event_id\n            if data == \"[DONE]\":\n                done = True\n                break\n            chunk = json.loads(data)\n            if \"progress\" in chunk:\n                print(\"...\", chunk[\"progress\"][\"message\"][\"en\"])\n            elif \"report\" in chunk:\n                report = chunk[\"report\"]  # the result to keep\n            elif \"error\" in chunk:\n                print(\"error:\", chunk[\"error\"].get(\"message\"))\n    except requests.HTTPError as exc:\n        # 404: unknown, created under a different access, or past retention -- stop.\n        if exc.response.status_code < 500 and exc.response.status_code != 429:\n            raise\n        time.sleep(2)\n    except requests.RequestException:\n        # Dropped, mid-event or before connecting: resume from the last id.\n        time.sleep(2)\n    # Fell out without [DONE]: the server closed this response on purpose. Resume.\n\nprint(report[\"title\"] if report else \"no report (see the job's status)\")\n"
      - lang: TypeScript
        label: TypeScript - stream with resume
        source: "// Node 18+ (built-in fetch). Follow a job's events to the end, resuming from the last\n// event id after every closed or dropped connection.\nconst BASE_URL = \"https://api.fanar.qa\";\nconst API_KEY = \"YOUR_API_KEY_HERE\";\nconst JOB_ID = \"YOUR_JOB_ID\";\nconst headers = { Authorization: `Bearer ${API_KEY}` };\n\nclass Fatal extends Error {}\n\ninterface Chunk {\n  progress?: { message: { en: string } };\n  report?: { title: string };\n  error?: { message?: string };\n}\n\n// One response. True on [DONE]; false when it ends without it (resume).\nasync function readSegment(state: { lastId: string | null }, onChunk: (c: Chunk) => void): Promise<boolean> {\n  const url = new URL(`${BASE_URL}/v1/sadiq/deep-research/${JOB_ID}`);\n  url.searchParams.set(\"stream\", \"true\");\n  if (state.lastId) url.searchParams.set(\"starting_after\", state.lastId);\n  const res = await fetch(url, { headers });\n  if (res.status >= 400 && res.status < 500 && res.status !== 429) {\n    throw new Fatal(`HTTP ${res.status}: ${await res.text()}`); // e.g. 404: unknown job\n  }\n  if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);\n\n  const decoder = new TextDecoder();\n  let buffer = \"\";\n  for await (const bytes of res.body as unknown as AsyncIterable<Uint8Array>) {\n    buffer += decoder.decode(bytes, { stream: true });\n    let end: number;\n    while ((end = buffer.indexOf(\"\\n\\n\")) !== -1) {\n      const block = buffer.slice(0, end);\n      buffer = buffer.slice(end + 2);\n      let id: string | null = null;\n      let data: string | null = null;\n      for (const line of block.split(\"\\n\")) {\n        if (line.startsWith(\"id: \")) id = line.slice(4);\n        else if (line.startsWith(\"data: \")) data = line.slice(6);\n      }\n      if (data === null) continue; // keepalive\n      state.lastId = id ?? state.lastId;\n      if (data === \"[DONE]\") return true;\n      onChunk(JSON.parse(data) as Chunk);\n    }\n  }\n  return false;\n}\n\nasync function follow(): Promise<void> {\n  const state = { lastId: null as string | null };\n  let report: Chunk[\"report\"] | null = null;\n  const onChunk = (chunk: Chunk) => {\n    if (chunk.progress) console.log(\"...\", chunk.progress.message.en);\n    else if (chunk.report) report = chunk.report; // the result to keep\n    else if (chunk.error) console.log(\"error:\", chunk.error.message);\n  };\n  for (;;) {\n    try {\n      if (await readSegment(state, onChunk)) break;\n    } catch (err) {\n      if (err instanceof Fatal) throw err;\n      await new Promise((resolve) => setTimeout(resolve, 2000));\n    }\n  }\n  console.log(report ? (report as { title: string }).title : \"no report (see the job's status)\");\n}\n\nfollow().catch((err) => {\n  console.error(err.message);\n  process.exit(1);\n});\n"
