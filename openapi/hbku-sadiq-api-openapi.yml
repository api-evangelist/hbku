          - type: 'null'
          title: Background
          description: 'Run the research as a background job. The response is a `Job` returned immediately; retrieve it with `GET /v1/sadiq/deep-research/{id}`. With `stream: true` as well, the job''s events stream on this same connection and can be resumed with `GET /v1/sadiq/deep-research/{id}?stream=true`.'
          default: false
      type: object
      required:
      - model
      - input
      title: DeepResearchRequest
      example:
        model: Fanar-Sadiq-2
        input: ما أهمية طلب العلم في الإسلام؟
        depth: quick
        background: true
