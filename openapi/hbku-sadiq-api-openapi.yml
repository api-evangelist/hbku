      x-codeSamples:
      - lang: Curl
        label: cURL
        source: "# Idempotent: cancelling a finished job returns it unchanged. Quota is not refunded.\ncurl -X POST \"https://api.fanar.qa/v1/sadiq/deep-research/YOUR_JOB_ID/cancel\" \\\n  -H \"Authorization: Bearer YOUR_API_KEY_HERE\"\n"
      - lang: Python
        label: Python - cancel and confirm
        source: "# Cancellation is asynchronous, and a job already finishing may complete anyway:\n# check the status you end with.\n\nimport time\n\nimport requests\n\nBASE_URL = \"https://api.fanar.qa\"\nAPI_KEY = \"YOUR_API_KEY_HERE\"\nHEADERS = {\"Authorization\": f\"Bearer {API_KEY}\"}\nJOB_ID = \"YOUR_JOB_ID\"\n\njob = requests.post(\n    f\"{BASE_URL}/v1/sadiq/deep-research/{JOB_ID}/cancel\", headers=HEADERS, timeout=30\n).json()\n\nwhile job[\"status\"] in (\"queued\", \"in_progress\"):\n    time.sleep(1)\n    job = requests.get(\n        f\"{BASE_URL}/v1/sadiq/deep-research/{JOB_ID}\", headers=HEADERS, timeout=30\n    ).json()\n\nif job[\"status\"] == \"cancelled\":\n    print(\"cancelled\")\nelse:\n    print(f\"finished before the cancel landed: {job['status']}\")\n"
      - lang: TypeScript
        label: TypeScript - cancel and confirm
        source: "// Node 18+. Cancellation is asynchronous, and a job already finishing may complete\n// anyway: check the status you end with.\nconst BASE_URL = \"https://api.fanar.qa\";\nconst API_KEY = \"YOUR_API_KEY_HERE\";\nconst JOB_ID = \"YOUR_JOB_ID\";\nconst headers = { Authorization: `Bearer ${API_KEY}` };\n\ninterface Job { id: string; status: string }\n\nasync function call(path: string, method = \"GET\"): Promise<Job> {\n  const res = await fetch(`${BASE_URL}${path}`, { method, headers });\n  if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);\n  return (await res.json()) as Job;\n}\n\nasync function main(): Promise<void> {\n  let job = await call(`/v1/sadiq/deep-research/${JOB_ID}/cancel`, \"POST\");\n  while (job.status === \"queued\" || job.status === \"in_progress\") {\n    await new Promise((resolve) => setTimeout(resolve, 1000));\n    job = await call(`/v1/sadiq/deep-research/${JOB_ID}`);\n  }\n  console.log(job.status === \"cancelled\" ? \"cancelled\" : `finished before the cancel landed: ${job.status}`);\n}\n\nmain().catch((err) => {\n  console.error(err.message);\n  process.exit(1);\n});\n"
