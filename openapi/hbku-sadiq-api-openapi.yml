    Job:
      properties:
        id:
          type: string
          title: Id
          description: The job id. Also returned as the `X-Id` header on create.
        object:
          $ref: '#/components/schemas/JobObject'
          default: job
        type:
          $ref: '#/components/schemas/JobTypeName'
        status:
          $ref: '#/components/schemas/JobStatus'
          description: '`queued` → `in_progress` → one of `completed`, `failed`, `cancelled`, `incomplete`. `incomplete` means the output was stopped by a content filter.'
        incomplete_details:
          anyOf:
          - $ref: '#/components/schemas/IncompleteDetails'
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/JobError'
          - type: 'null'
        progress_pct:
          type: integer
          title: Progress Pct
          description: Research progress, 0-100. It can reach 100 while the last sentences are still being checked; only `status` says the job is done.
          default: 0
        attempt:
          type: integer
          title: Attempt
          description: How many times this job has been started. Above 1 means it was restarted after a server failure, and its events replayed from the start.
          default: 0
        created_at:
          type: integer
          title: Created At
        started_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Started At
        completed_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Completed At
        updated_at:
          type: integer
          title: Updated At
          description: When the job was last updated. A running job is updated every few seconds.
        cancel_source:
          anyOf:
          - $ref: '#/components/schemas/CancelSource'
          - type: 'null'
        request:
          $ref: '#/components/schemas/DeepResearchJobRequest'
        result:
          anyOf:
          - $ref: '#/components/schemas/DeepResearchReport-Output'
          - type: 'null'
          description: 'Set when `status` is `completed`: the report, exactly as the synchronous endpoint returns it.'
      type: object
      required:
      - id
      - type
      - status
      - created_at
      - updated_at
      - request
      title: Job
