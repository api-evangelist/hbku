      security:
      - Bearer: []
      x-codeSamples:
      - lang: Curl
        label: cURL - background job
        source: "# Deep research requires the sadiq_deep_research feature flag on your API key.\n# `background: true` returns a job at once; the research runs whatever happens to\n# your connection. Poll it with GET /v1/sadiq/deep-research/{id} until it ends.\ncurl -X POST \"https://api.fanar.qa/v1/sadiq/deep-research\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer YOUR_API_KEY_HERE\" \\\n  -d '{\n    \"model\": \"Fanar-Sadiq-2\",\n    \"input\": \"Your research topic here\",\n    \"depth\": \"standard\",\n    \"background\": true\n  }'\n"
      - lang: cURL - single request
        label: cURL - single request
        source: "# A run takes minutes. If it times out or drops, use \"cURL - background job\".\ncurl -X POST \"https://api.fanar.qa/v1/sadiq/deep-research\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer YOUR_API_KEY_HERE\" \\\n  --max-time 1800 \\\n  -d '{\n    \"model\": \"Fanar-Sadiq-2\",\n    \"input\": \"Your research topic here\",\n    \"depth\": \"standard\",\n    \"web_search\": false,\n    \"stream\": false\n  }'\n"
      - lang: Python
        label: Python - single request
        source: "# One blocking call, one report back (~7-10 minutes for `standard`).\n# Seeing timeouts or dropped connections? Use \"Python - background job\".\n\nimport requests\n\nBASE_URL = \"https://api.fanar.qa\"\nAPI_KEY = \"YOUR_API_KEY_HERE\"\n\n\ndef deep_research(topic, depth=\"standard\", web_search=False):\n    response = requests.post(\n        f\"{BASE_URL}/v1/sadiq/deep-research\",\n        headers={\n            \"Authorization\": f\"Bearer {API_KEY}\",\n            \"Content-Type\": \"application/json\",\n        },\n        json={\n            \"model\": \"Fanar-Sadiq-2\",\n            \"input\": topic,\n            \"depth\": depth,\n            \"web_search\": web_search,\n            \"stream\": False,\n        },\n        timeout=1800,\n    )\n    response.raise_for_status()\n    return response.json()\n\n\nreport = deep_research(\"The importance of seeking knowledge in Islam\")\n\nprint(report[\"title\"])\nprint(report[\"overview\"])\nfor section in report.get(\"sections\") or []:\n    print(f\"\\n## {section['heading']}\")\n    print(section[\"content\"])\n# A source is {source, citation_tag, quote, was_cited} -- a URL and its citation tag,\n# not a numbered reference. `quote` is the passage the report drew on.\nfor source in report.get(\"sources\") or []:\n    print(f\"{source.get('citation_tag', '')} {source['source']}\")\n"
      - lang: Python - streaming
        label: Python - streaming
        source: "# Holds one connection for the whole run; for a stream that survives drops, use\n# \"Python - background + stream\". Take the result from the `report` chunk.\n#\n#   {\"progress\": {\"message\": {\"en\": ..., \"ar\": ...}}}   a pass completed\n#   {\"choices\": [{\"delta\": {\"content\": \"...\"}}]}        prose, token by token\n#   {\"report\": {...}}                                   the finished report\n#   {\"choices\": [{\"finish_reason\": \"stop\", ...}]}       usage + references\n#   data: [DONE]                                        end of stream\n\nimport json\n\nimport requests\n\nBASE_URL = \"https://api.fanar.qa\"\nAPI_KEY = \"YOUR_API_KEY_HERE\"\n\n\ndef deep_research_stream(topic, depth=\"standard\", web_search=False):\n    \"\"\"Yield (kind, payload) for each event; kind is progress|delta|report|done.\"\"\"\n    with requests.post(\n        f\"{BASE_URL}/v1/sadiq/deep-research\",\n        headers={\n            \"Authorization\": f\"Bearer {API_KEY}\",\n            \"Content-Type\": \"application/json\",\n        },\n        json={\n            \"model\": \"Fanar-Sadiq-2\",\n            \"input\": topic,\n            \"depth\": depth,\n            \"web_search\": web_search,\n            \"stream\": True,\n        },\n        stream=True,\n        timeout=1800,\n    ) as response:\n        response.raise_for_status()\n\n        for line in response.iter_lines(decode_unicode=True):\n            if not line or not line.startswith(\"data: \"):\n                continue\n            data = line[len(\"data: \"):].strip()\n            if data == \"[DONE]\":\n                break\n            chunk = json.loads(data)\n\n            if \"error\" in chunk:\n                raise RuntimeError(chunk[\"error\"].get(\"message\", \"stream error\"))\n            if \"progress\" in chunk:\n                yield \"progress\", chunk[\"progress\"][\"message\"][\"en\"]\n                continue\n            if \"report\" in chunk:\n                yield \"report\", chunk[\"report\"]\n                continue\n\n            choice = (chunk.get(\"choices\") or [{}])[0]\n            if choice.get(\"finish_reason\"):\n                yield \"done\", chunk\n            elif choice.get(\"delta\", {}).get(\"content\"):\n                yield \"delta\", choice[\"delta\"][\"content\"]\n\n\nreport = None\nfor kind, payload in deep_research_stream(\"The importance of seeking knowledge in Islam\"):\n    if kind == \"progress\":\n        print(f\"... {payload}\")\n    elif kind == \"report\":\n        report = payload\n    elif kind == \"done\":\n        # `metadata` carries the run facts (depth, elapsed_seconds, total_sources,\n        # web_search_used). `usage` is often absent on this endpoint -- do not rely on it.\n        print(f\"\\nmetadata: {payload.get('metadata')}\")\n\nif report:\n    print(report[\"title\"])\n    print(report.get(\"markdown\") or report[\"overview\"])\n"
      - lang: Python - background job
        label: Python - background job
        source: "# Recommended: `background: true` returns a job at once; poll it until it ends.\n\nimport time\n\nimport requests\n\nBASE_URL = \"https://api.fanar.qa\"\nAPI_KEY = \"YOUR_API_KEY_HERE\"\nHEADERS = {\"Authorization\": f\"Bearer {API_KEY}\"}\n\nresponse = requests.post(\n    f\"{BASE_URL}/v1/sadiq/deep-research\",\n    headers=HEADERS,\n    json={\n        \"model\": \"Fanar-Sadiq-2\",\n        \"input\": \"The importance of seeking knowledge in Islam\",\n        \"depth\": \"standard\",\n        \"background\": True,\n    },\n    timeout=30,\n)\nresponse.raise_for_status()\njob = response.json()\nprint(f\"job {job['id']}: {job['status']}\")\n\nwhile job[\"status\"] in (\"queued\", \"in_progress\"):\n    time.sleep(10)\n    job = requests.get(\n        f\"{BASE_URL}/v1/sadiq/deep-research/{job['id']}\", headers=HEADERS, timeout=30\n    ).json()\n    # progress_pct can sit at 100 for a while: the last sentences are still being\n    # checked before the job completes.\n    print(f\"{job['status']} {job['progress_pct']}%\")\n\nif job[\"status\"] == \"completed\":\n    report = job[\"result\"]\n    print(report[\"title\"])\n    print(report.get(\"markdown\") or report[\"overview\"])\nelif job[\"status\"] == \"incomplete\":\n    print(\"stopped by a content filter:\", job[\"incomplete_details\"][\"reason\"])\nelse:  # failed or cancelled\n    raise SystemExit(f\"{job['status']}: {job['error']}\")\n"
      - lang: TypeScript
        label: TypeScript - background job
        source: "// Node 18+ (built-in fetch). Submit in the background and poll until the job ends.\nconst BASE_URL = \"https://api.fanar.qa\";\nconst API_KEY = \"YOUR_API_KEY_HERE\";\nconst headers = { Authorization: `Bearer ${API_KEY}`, \"Content-Type\": \"application/json\" };\n\ntype JobStatus = \"queued\" | \"in_progress\" | \"completed\" | \"failed\" | \"cancelled\" | \"incomplete\";\n\ninterface Job {\n  id: string;\n  status: JobStatus;\n  progress_pct: number;\n  result: { title: string; overview: string; markdown?: string } | null;\n  error: { code: string; message: string } | null;\n  incomplete_details: { reason: string } | null;\n}\n\nasync function call(path: string, init?: RequestInit): Promise<Job> {\n  const res = await fetch(`${BASE_URL}${path}`, { ...init, headers });\n  if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);\n  return (await res.json()) as Job;\n}\n\nasync function main(): Promise<void> {\n  let job = await call(\"/v1/sadiq/deep-research\", {\n    method: \"POST\",\n    body: JSON.stringify({\n      model: \"Fanar-Sadiq-2\",\n      input: \"The importance of seeking knowledge in Islam\",\n      depth: \"standard\",\n      background: true,\n    }),\n  });\n  console.log(`job ${job.id}: ${job.status}`);\n\n  while (job.status === \"queued\" || job.status === \"in_progress\") {\n    await new Promise((resolve) => setTimeout(resolve, 10_000));\n    job = await call(`/v1/sadiq/deep-research/${job.id}`);\n    console.log(`${job.status} ${job.progress_pct}%`);\n  }\n\n  if (job.status === \"completed\" && job.result) {\n    console.log(job.result.title);\n    console.log(job.result.markdown ?? job.result.overview);\n  } else if (job.status === \"incomplete\") {\n    console.log(\"stopped by a content filter:\", job.incomplete_details?.reason);\n  } else {\n    throw new Error(`${job.status}: ${job.error?.message}`);\n  }\n}\n\nmain().catch((err) => {\n  console.error(err.message);\n  process.exit(1);\n});\n"
      - lang: Python - background + stream
        label: Python - background + stream
        source: "# The job's events stream on this connection; its id is in the X-Id header.\n# A response that ends without `data: [DONE]` is resumed from the last event id.\n\nimport json\nimport time\n\nimport requests\n\nBASE_URL = \"https://api.fanar.qa\"\nAPI_KEY = \"YOUR_API_KEY_HERE\"\nHEADERS = {\"Authorization\": f\"Bearer {API_KEY}\"}\n\n\ndef follow(response, state):\n    \"\"\"Read events until [DONE] (True) or the response ends (False).\"\"\"\n    event_id = None\n    for line in response.iter_lines(decode_unicode=True):\n        if line.startswith(\"id: \"):\n            event_id = line[4:]\n        elif line.startswith(\"data: \"):\n            state[\"last_id\"] = event_id\n            data = line[6:]\n            if data == \"[DONE]\":\n                return True\n            chunk = json.loads(data)\n            if \"progress\" in chunk:\n                print(\"...\", chunk[\"progress\"][\"message\"][\"en\"])\n            elif \"report\" in chunk:\n                # Use the report as the result, not the concatenated deltas. If a\n                # worker fails, the job restarts and its events replay from the start\n                # once -- the report is still the one to keep.\n                state[\"report\"] = chunk[\"report\"]\n    return False\n\n\nstate = {\"last_id\": None, \"report\": None}\nwith requests.post(\n    f\"{BASE_URL}/v1/sadiq/deep-research\",\n    headers=HEADERS,\n    json={\n        \"model\": \"Fanar-Sadiq-2\",\n        \"input\": \"The importance of seeking knowledge in Islam\",\n        \"depth\": \"standard\",\n        \"background\": True,\n        \"stream\": True,\n    },\n    stream=True,\n    timeout=(10, 120),  # a keepalive arrives every 15 seconds of quiet\n) as response:\n    response.raise_for_status()\n    job_id = response.headers[\"X-Id\"]\n    try:\n        done = follow(response, state)\n    except requests.RequestException:\n        done = False  # the job does not depend on this connection; resume below\n\nwhile not done:\n    try:\n        with requests.get(\n            f\"{BASE_URL}/v1/sadiq/deep-research/{job_id}\",\n            headers=HEADERS,\n            params={\"stream\": \"true\", \"starting_after\": state[\"last_id\"]},\n            stream=True,\n            timeout=(10, 120),\n        ) as response:\n            response.raise_for_status()\n            done = follow(response, state)\n    except requests.HTTPError as exc:\n        if exc.response.status_code < 500 and exc.response.status_code != 429:\n            raise  # 404: gone or never yours -- stop\n        time.sleep(2)\n    except requests.RequestException:\n        time.sleep(2)  # dropped, mid-event or before connecting: resume from the last id\n\n# The job object is the authoritative outcome: completed, failed, cancelled, incomplete.\njob = requests.get(f\"{BASE_URL}/v1/sadiq/deep-research/{job_id}\", headers=HEADERS, timeout=30).json()\nprint(job[\"status\"])\nif job[\"status\"] == \"completed\":\n    print(job[\"result\"][\"title\"])\n"
