paths:
  /v1/sadiq/validate:
    post:
      tags:
      - Sadiq
      summary: Validate Text
      description: 'Detects and verifies Qur''an and hadith quotations inside arbitrary text. Send a block of text — an LLM answer, a user message, an article — and it comes back with the Qur''anic verses and hadith tagged and linked to their canonical sources. Quotations that cannot be confirmed are returned as plain, untagged text, which is the signal callers act on.


        Verified Qur''anic verses are replaced with authenticated Quran text wrapped in `` / `` with a `surah:ayah` markdown reference; verified hadith are wrapped in `` / `` with a `collection:number` reference. To render, strip the tags and keep the links.


        Example — input:

        قال الله تعالى: إن الصلاة تنهى عن الفحشاء والمنكر. وقال النبي صلى الله عليه وسلم: إنما الأعمال بالنيات.


        Output text:

        قال الله تعالى: <quran_start>ٱتْلُ مَآ أُوحِىَ إِلَيْكَ مِنَ ٱلْكِتَـٰبِ وَأَقِمِ ٱلصَّلَوٰةَ ۖ إِنَّ ٱلصَّلَوٰةَ تَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ ۗ وَلَذِكْرُ ٱللَّهِ أَكْبَرُ ۗ وَٱللَّهُ يَعْلَمُ مَا تَصْنَعُونَ ٤٥<quran_end> وقال النبي صلى الله عليه وسلم: <hadith_start>إنما الأعمال بالنيات<hadith_end> riyadussalihin:1


        The partially quoted verse is replaced with the full authenticated ayah and cited; the hadith is tagged and cited. An unverifiable quotation would come back untagged.


        With `stream: true` the result is sent as Server-Sent Events as it is produced: `data: {"id", "delta"}` frames whose deltas join to `text`, each verified quotation whole in one frame, then `data: [DONE]`.


        This endpoint requires additional authorization and is not allowed by default. Please contact support@fanar.qa.'
      operationId: validate_text_v1_sadiq_validate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SadiqValidationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SadiqValidationResponse'
            text/event-stream:
              example: 'data: {"id":"3f2c1e8a-…","delta":"قال الله تعالى: "}


                data: {"id":"3f2c1e8a-…","delta":"<quran_start>ٱتْلُ مَآ أُوحِىَ إِلَيْكَ مِنَ ٱلْكِتَـٰبِ … [٤٥](https://quran.com/29/45)<quran_end> وقال النبي صلى الله "}


                data: {"id":"3f2c1e8a-…","delta":"عليه وسلم: <hadith_start>إنما الأعمال بالنيات<hadith_end> [riyadussalihin:1](https://sunnah.com/riyadussalihin:1)"}


                data: [DONE]


                '
        '401':
          description: Invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_authentication
                  message: Invalid authentication
                  status: 401
        '403':
          description: Invalid authorization
