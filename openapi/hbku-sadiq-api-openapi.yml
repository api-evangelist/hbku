      - lang: Curl
        label: cURL
        source: "curl -X POST \"https://api.fanar.qa/v1/sadiq/validate\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer YOUR_API_KEY\" \\\n  -d '{\n    \"model\": \"Fanar-Sadiq-2\",\n    \"text\": \"قال الله تعالى: إن الصلاة تنهى عن الفحشاء والمنكر. وقال النبي صلى الله عليه وسلم: إنما الأعمال بالنيات.\"\n  }'\n"
      - lang: Python
        label: Python - requests
        source: "# Quran & hadith validation requires additional authorization and is not allowed by default.\n\nimport requests\n\nheaders = {\n    \"Authorization\": \"Bearer YOUR_API_KEY\",\n    \"Content-Type\": \"application/json\",\n}\n\njson_data = {\n    \"model\": \"Fanar-Sadiq-2\",\n    \"text\": \"قال الله تعالى: إن الصلاة تنهى عن الفحشاء والمنكر. وقال النبي صلى الله عليه وسلم: إنما الأعمال بالنيات.\",\n}\n\nresponse = requests.post(\"https://api.fanar.qa/v1/sadiq/validate\", headers=headers, json=json_data)\n\nprint(response.json())\n"
  /v1/sadiq/deep-research:
    post:
      tags:
      - Sadiq
      summary: Create Deep Research
      description: 'A structured research report on an Islamic topic from **Fanar-Sadiq-2**, with headings and cited sources.


        **Depth levels:**

        - `quick` — single-pass summary, fastest

        - `standard` *(default)* — multi-pass, balanced

        - `comprehensive` — exhaustive, widest source coverage


        **Expected runtime** — minutes, not seconds: about 3-6 min for `quick`, 7-10 min for `standard`, longer for `comprehensive`.


        **Background mode (recommended).** Because a run is this long, set `background: true`: the call returns a `Job` at once (its id also in `X-Id`) and the research no longer depends on your connection. Poll `GET /v1/sadiq/deep-research/{id}` for the result, or add `stream: true` to receive its events on this connection, resumable after a drop.


        **Without `background`**, one connection is held for the whole run: `stream: true` (default) sends Server-Sent Events ending with the `report`, `stream: false` sends the report as JSON. If you see timeouts or disconnects, switch to background mode.


        This endpoint requires additional authorization and is not allowed by default. Please contact support@fanar.qa.'
      operationId: create_deep_research_v1_sadiq_deep_research_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeepResearchRequest'
        required: true
      responses:
        '200':
          description: 'A structured report (synchronous, non-streaming), an SSE stream (streaming), or, with `background: true`, a `Job` -- or the job''s event stream when `stream` is also true.'
