x-coverage:
  state: covered
  reason: covered
  detail: >-
    Two institution-operated APIs were found, read and probed live: the Fanar API (first-party
    OpenAPI 3.1.0, 11 paths / 12 operations, retrieved from api.fanar.qa/openapi.json) and the
    Farasa Web API (no published contract; six endpoints confirmed by probe). Both are operated by
    the Qatar Computing Research Institute, a research institute of HBKU — qcri.org redirects to
    hbku.edu.qa/en/qcri, and fanar.qa states "Developed by Qatar Computing Research Institute at
    Hamad Bin Khalifa University". Three tenant surfaces on HBKU hosts were also confirmed by
    protocol rather than by link: a fully answering unauthenticated OAI-PMH 2.0 endpoint over
    Elsevier Pure at elmi.hbku.edu.qa/ws/oai (Identify, ListMetadataFormats, ListSets and
    ListRecords all served), a CourseLeaf JSON course-search API at catalog.hbku.edu.qa that
    responds but whose term database is missing server-side, and the Manara research repository on
    Qatar National Library's Figshare platform. The negatives were probed, not assumed: no
    open-data portal (data.hbku.edu.qa does not resolve), no registrar/SIS API (sis. and banner. do
    not resolve), no identity federation (no Qatari federation among eduGAIN's 92 and no hbku.edu.qa
    entity; idp.hbku.edu.qa does not resolve, sso.hbku.edu.qa serves a mismatched certificate), no
    security.txt and no llms.txt. api.hbku.edu.qa resolves but every request is refused by a BIG-IP
    WAF with no documented interface behind it.
