apis:
- aid: hbku:figshare-oai
  name: Figshare OAI-PMH (Manara - HBKU Research)
  description: >-
    Figshare exposes an OAI-PMH v2.0 metadata harvesting endpoint that provides access to public article
    metadata across the platform, including HBKU works hosted in Manara - Qatar Research Repository. Harvesting
    can be filtered to a specific portal/set, and supported metadata formats include Dublin Core (oai_dc),
    DataCite, RDF, CERIF, Qualified Dublin Core, METS, and UKETD_DC. This is third-party infrastructure
    hosting HBKU content.
  humanURL: https://docs.figshare.com/
