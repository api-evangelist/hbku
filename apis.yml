- aid: hbku:course-catalog-search
  name: HBKU Academic Catalog — Course Search
  x-operator: tenant
  description: >-
    HBKU publishes its academic catalog on its own host, catalog.hbku.edu.qa, running CourseLeaf.
    The catalog ships a JSON course-search endpoint at /course-search/api/ that answers
    unauthenticated POSTs — but its backing term database is missing server-side: a well-formed
    query against the term the page itself advertises (srcdb 202410) returns HTTP 200 with
    {"fatal":"Could not execute database query: Cannot open database: \"fose-clss202410\""}. So
    the surface is live and reachable and cannot currently return course data. Recorded because a
    course catalog is one of the few genuinely institutional surface classes and this one is real;
    marked tenant because the interface is CourseLeaf's, on HBKU's host with HBKU's data. No
    CourseLeaf specification is stored under this slug.
