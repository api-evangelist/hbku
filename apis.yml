specificationVersion: '0.19'
apis:
  - aid: hbku:figshare-api
    name: Figshare API v2 (Manara - HBKU Research)
    description: >-
      HBKU scholarly outputs are deposited in Manara - Qatar Research
      Repository, an open repository operated by Qatar National Library and
      powered by Figshare. Public article, dataset, and collection metadata
      for HBKU works is accessible programmatically through Figshare's
      JSON-based REST API v2, which supports search and retrieval of articles,
      authors, statistics, and files. This is a third-party platform hosting
      HBKU content rather than an API operated by HBKU itself.
    humanURL: https://docs.figshare.com/
    baseURL: https://api.figshare.com/v2
    tags: [ Research, Open Access, Repository, Datasets, Figshare ]
    properties:
      - type: Documentation
        url: https://docs.figshare.com/
      - type: Authentication
        url: https://docs.figshare.com/#figshare_documentation_oauth
      - type: OpenAPI
        url: openapi/hbku-figshare-api.yaml
  - aid: hbku:figshare-oai
    name: Figshare OAI-PMH (Manara - HBKU Research)
    description: >-
      Figshare exposes an OAI-PMH v2.0 metadata harvesting endpoint that
      provides access to public article metadata across the platform,
      including HBKU works hosted in Manara - Qatar Research Repository.
      Harvesting can be filtered to a specific portal/set, and supported
      metadata formats include Dublin Core (oai_dc), DataCite, RDF, CERIF,
      Qualified Dublin Core, METS, and UKETD_DC. This is third-party
      infrastructure hosting HBKU content.
    humanURL: https://docs.figshare.com/
    baseURL: https://api.figshare.com/v2/oai
    tags: [ Research, Open Access, OAI-PMH, Metadata, Harvesting, Figshare ]
    properties:
      - type: Documentation
        url: https://help.figshare.com/article/how-to-use-the-oai-pmh
