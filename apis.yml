---
aid: hbku
name: Hamad Bin Khalifa University
description: >-
  Hamad Bin Khalifa University (HBKU) is a research-intensive graduate
  university founded in 2010 as part of Qatar Foundation, located in
  Education City, Doha, Qatar, and ranked #183 in the QS World University
  Rankings 2025. HBKU does not operate a centralized public developer portal
  or documented institutional API; its student information, academic catalog,
  and library discovery systems are gated behind authentication. The most
  significant public, machine-readable footprint is its scholarly research
  output, which is deposited in Manara - Qatar Research Repository, a
  Figshare-powered repository hosted by Qatar National Library that exposes
  HBKU works through Figshare's public REST API v2 and OAI-PMH metadata
  harvesting endpoint.
