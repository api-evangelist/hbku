- aid: hbku:elmi-oai-pmh
  name: Elmi Research Portal — OAI-PMH
  x-operator: tenant
  description: >-
    HBKU's research information system, Elmi, runs Elsevier Pure on the university's own subdomain
    and exposes a public, unauthenticated OAI-PMH 2.0 harvesting endpoint at
    elmi.hbku.edu.qa/ws/oai. Confirmed by the protocol handshake on 2026-08-30, not by link
    presence: ?verb=Identify returns a valid envelope declaring adminEmail elmi@hbku.edu.qa,
    protocolVersion 2.0 and earliestDatestamp 2024-07-18; ?verb=ListMetadataFormats offers oai_dc,
    qdc, mods, mods_swepub, nl_didl, xmetadiss and uketd_dc; ?verb=ListSets offers persons:all,
    publications:all, publications:withFiles and per-year sets; a ListRecords call returned 96KB of
    records with no credential. This is the one education-regime domain standard HBKU meets. Marked
    tenant because the software is Elsevier's (repositoryName "Pure OAI Repository", and the Pure
    REST API at /ws/api canonicalizes to api.elsevierpure.com) — the metadata is HBKU's, the
    contract is not. Elsevier's Pure REST API on the same host requires an API key (401 on
    /ws/api/persons) and no Pure specification is stored under this slug.
  humanURL: https://elmi.hbku.edu.qa/
  baseURL: https://elmi.hbku.edu.qa/ws/oai
