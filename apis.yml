- aid: hbku:farasa-api
  name: Farasa Web API
  x-operator: institution
  description: >-
    Farasa ("insight") is the Arabic text-processing toolkit built by the Arabic Language
    Technologies group at QCRI, Hamad Bin Khalifa University, and offered free to registered users
    as a keyed web API. Six endpoints were confirmed live on 2026-08-30 by unauthenticated POST
    probes — segmentation, lemmatization, pos, ner, diacritize and spellcheck each returned 400
    "invalid api key", while sibling module paths returned 404. The api_key travels in the request
    body rather than a header. No OpenAPI is published by the provider; the definition in this repo
    is DERIVED from QCRI's own Python/Java/JavaScript/curl samples plus those probes, and the
    success payload shape is deliberately left unasserted because it could not be observed.
