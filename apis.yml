description: >-
  Hamad Bin Khalifa University (HBKU) is a research-intensive graduate university founded in 2010
  within Qatar Foundation, in Education City, Doha, Qatar. Its central administration publishes no
  developer portal, no open-data portal and no identity federation entry — HBKU appears in no
  eduGAIN federation, and api.hbku.edu.qa answers every request with a WAF rejection. What it does
  operate comes almost entirely from one research institute, the Qatar Computing Research Institute
  (QCRI), whose domain qcri.org redirects into hbku.edu.qa: Fanar, Qatar's Arabic generative-AI
  platform, which publishes a first-party OpenAPI 3.1 at api.fanar.qa/openapi.json covering chat,
  speech, vision, translation, poetry and moderation, with a fourteen-code error vocabulary and a
  published per-model rate-limit table; and Farasa, a keyed Arabic NLP web API. Three further
  surfaces are tenant deployments on HBKU hosts and are recorded as relationships, not as HBKU
  contracts: a working public OAI-PMH 2.0 endpoint over its Elsevier Pure research portal at
  elmi.hbku.edu.qa/ws/oai, a CourseLeaf course-search API at catalog.hbku.edu.qa whose term
  database is currently unavailable, and its research deposits in Manara — Qatar Research
  Repository, a Figshare platform run by Qatar National Library. The eleven "HBKU" Figshare API
  definitions this profile previously carried were one vendor contract, split eleven ways by tag and
  recorded under the university's name; they have been removed.
