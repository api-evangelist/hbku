- aid: hbku:fanar-api
  name: Fanar API
  x-operator: institution
  description: >-
    Fanar is Qatar's Arabic generative-AI platform, developed by the Qatar Computing Research
    Institute at Hamad Bin Khalifa University with support from Qatar's Ministry of Communications
    and Information Technology. The API publishes a first-party OpenAPI 3.1.0 document at
    api.fanar.qa/openapi.json: 11 paths and 12 operations spanning chat completions (streaming over
    text/event-stream), text-to-speech, transcription, custom voices, image generation, translation,
    poetry generation, moderation, tokenization and model listing. It is OpenAI-client compatible —
    the provider's own sample points the openai SDK at base_url https://api.fanar.qa/v1. Bearer
    authentication, fourteen documented error statuses behind a single Error envelope, and a
    published per-model rate-limit table with x-ratelimit-* and ratelimit-policy response headers.
    Access is by request. Verified live 2026-08-30: GET /v1/models returns 401 invalid_authentication.
