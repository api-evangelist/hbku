  - date: '2026-06-03'
    rating: 2
    summary: >-
      HBKU operates no centralized public developer portal or documented
      institutional API. Its official website, academic catalog, library, and
      research management (Elmi) sites resolve live but expose no public
      programmatic access; catalog and SIS data are gated. The verifiable
      public, machine-readable footprint is HBKU research output deposited in
      Manara - Qatar Research Repository (Figshare-powered, hosted by Qatar
      National Library), which is reachable through Figshare's public REST
      API v2 and OAI-PMH endpoint — both confirmed live. A research-lab
      GitHub org (cri-lab-hbku) exists but is not a central university API
      org. No endpoints were fabricated; only third-party hosting platforms
      with confirmed public APIs are cataloged as HBKU's API surface.
