  - date: '2026-08-30'
    rating: 6
    pipeline: pipeline-university.md
    summary: >-
      Re-profiled under the university pipeline, with operator attribution settled before anything
      was saved. The June review's central conclusion — that HBKU operates no institutional API —
      was wrong in one direction and its artifact set was wrong in another. Wrong in the artifact
      set: eleven "HBKU" OpenAPIs in this repo were a single Figshare contract (info.title
      "Figshare API", contact "Figshare Support", servers https://api.figshare.com/v2) split by
      tag, a document a dozen other universities in this catalog also ship. Those and every
      artifact derived from them have been removed. Wrong in the conclusion: HBKU does operate
      first-party APIs, through the Qatar Computing Research Institute. Fanar — Qatar's Arabic
      generative-AI platform — publishes a genuine first-party OpenAPI 3.1.0 with 12 operations,
      bearer auth, a fourteen-code error vocabulary and a published per-model rate-limit table.
      Farasa exposes six live Arabic NLP endpoints. Two further surfaces the June review recorded
      as having no API in fact do: Elmi serves a fully working public OAI-PMH 2.0 endpoint, and the
      academic catalog ships a JSON course-search API (currently returning a server-side database
      error). Net effect on score is expected to be down, not up: the Figshare volume that inflated
      it is gone and what replaces it is smaller, but it is actually HBKU's.
