description: >-
  Hamad Bin Khalifa University sells nothing through an API. Both interfaces it operates — the Fanar
  API and the Farasa Web API, each run by the Qatar Computing Research Institute — are free of
  charge and gated by a key you request rather than buy. Neither publishes a price, a paid tier or a
  billing surface; Fanar instead publishes a per-model rate-limit table and says higher throughput
  is arranged by contacting the team. This file was rewritten on 2026-08-30: the version it replaces
  described plans for library, course and repository interfaces the university does not operate.
notes: >-
  No commercial pricing exists to record. The only gate is registration, and the only quota is the
  published rate limit — see rate-limits/hbku-rate-limits.yml.
